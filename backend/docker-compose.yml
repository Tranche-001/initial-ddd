services:
  studyrats.service.platform.api:
    image: ${DOCKER_REGISTRY-}studyratsserviceplatformapi
    build:
      context: .
      dockerfile: studyRats.Service.Platform.Api/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DevDatabase=Host=postgres;Database=my_app_db;Username=postgres;Password=mysecretpassword
    depends_on:
      postgres:
        condition: service_healthy
 
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: my_app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
 
volumes:
  postgres_data: